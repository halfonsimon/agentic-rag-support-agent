[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "support-agent-portfolio"
version = "0.1.0"
description = "A bounded customer-support agent with semantic retrieval and exact catalog tools"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[project.scripts]
support-agent = "support_agent.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.setuptools.package-data]
support_agent = ["sample_data/*"]

[tool.ruff.lint.isort]
known-first-party = ["support_agent"]
